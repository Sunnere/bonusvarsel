name: Bonusvarsel collector

on:
  schedule:
    - cron: "*/30 * * * *"   # hver 30. min (kan endres senere)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: local-stable-baseline

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps (none needed)
        run: echo "No deps"

      - name: Run collector
        env:
          CHANNEL: SAS
          LANGUAGE: nb
          COUNTRY: no
          PER_PAGE: "100"
        run: NO_CACHE=1 CHANNEL=SAS LANGUAGE=nb COUNTRY=no PER_PAGE=100 node scripts/collect-loyaltykey.mjs

      - name: Arkiver historikk
        env:
          DATA_DIR: data
        run: node scripts/archive-history.mjs

      - name: Bygg tier-meldinger
        env:
          DATA_DIR: data
          DISPLAY_NAME: "SAS EuroBonus"
        run: node scripts/build-tier-messages.mjs

      - name: Commit historikk til repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/history data/tier-messages.json 2>/dev/null || true
          git commit -m "Arkiver historikk $(date +%Y-%m-%d)" 2>/dev/null || echo "Ingen endringer"
          git push 2>/dev/null || echo "Ingenting å pushe"

      - name: Notify Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PROGRAM: sas
          CHANNEL: SAS
          COUNTRY: no
          DISPLAY_NAME: "SAS EuroBonus"
          DATA_DIR: data
        run: |
          if [ ! -f "data/changes.json" ]; then
            echo "No changes.json – skipping notify"
            exit 0
          fi
          node scripts/notify-from-changes.mjs
